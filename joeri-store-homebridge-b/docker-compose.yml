version: "3.7"

services:
  server:
    image: homebridge/homebridge:latest
    # Always re-pull on (re)start so this tracks Homebridge's latest release
    # instead of a pinned version — see the Joeri Store README for the
    # tradeoff (no more manual Umbrel "Update" step, but also no pinning,
    # rollback, or release notes).
    pull_policy: always
    # container runs as root
    network_mode: host
    environment:
      # Moves the Homebridge UI off the image's default port 8581, and off
      # joeri-store-homebridge-a's port 8591, since both share the host
      # network.
      - HOMEBRIDGE_CONFIG_UI_PORT=8592
    # available at port 8592 (see environment above)
    volumes:
      - ${APP_DATA_DIR}/data/homebridge:/homebridge
    restart: on-failure

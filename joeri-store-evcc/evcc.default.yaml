# Default EVCC configuration, bundled with the app.
#
# docker-compose.yml copies this file to the persistent data directory as
# evcc.yaml the FIRST time the app starts (only if that file doesn't exist
# yet), then evcc runs from the copy. Editing this file after that has no
# effect on an already-installed app — edit the live file instead, at
# <app data dir>/data/evcc.yaml, or through evcc's own web UI settings.
#
# No meters/chargers/vehicles are defined here on purpose, so a fresh
# install always boots successfully and walks you through adding your own
# hardware via evcc's in-browser setup wizard.
#
# Full config reference: https://docs.evcc.io/docs/reference/configuration/

network:
  schema: http
  host: 0.0.0.0
  port: 7070

# Log level: fatal, error, warn, info, debug, trace
log: info

# Interval for status updates
interval: 30s

# Database for statistics (persisted via the mounted data volume)
database:
  type: sqlite
  dsn: /data/evcc.db

site:
  title: My Home

version: "3.7"

services:
  web:
    image: evcc/evcc:0.316.2
    restart: on-failure
    # network_mode: host is required for evcc's SMA Sunny Home Manager
    # (multicast), KEBA (UDP broadcast) and EEBus discovery to work at all —
    # none of these survive Docker's bridge-network NAT. As a side effect,
    # every port evcc binds (OCPP 8887, Modbus 8899/50502/51502, etc.) is
    # reachable directly on the Umbrel's own IP with no per-port publishing.
    # This app is therefore not proxied through Umbrel's app_proxy: reach it
    # directly at http://umbrel.local:7070 (no Tor/.onion, no auto-HTTPS).
    network_mode: host
    # If /data/evcc.yaml doesn't exist yet (fresh install), write a minimal
    # device-free default so the app boots instead of crashing, then hand
    # off to evcc's own setup wizard. Never overwrites an existing config.
    # The default is embedded here (not a bind-mounted sibling file) so it
    # doesn't depend on how the community app store lays out files on disk.
    command:
      - sh
      - -c
      - |
        if [ ! -f /data/evcc.yaml ]; then
        cat > /data/evcc.yaml <<'YAML'
        network:
          schema: http
          host: 0.0.0.0
          port: 7070
        log: info
        interval: 30s
        database:
          type: sqlite
          dsn: /data/evcc.db
        site:
          title: My Home
        YAML
        fi
        exec evcc --config /data/evcc.yaml
    volumes:
      - ${APP_DATA_DIR}/data:/data

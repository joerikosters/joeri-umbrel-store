version: "3.7"

services:

  app_proxy:
    environment:
      # Format: <app-id>_<docker-service-name>_1
      APP_HOST: joeri-store-evcc_web_1
      APP_PORT: 7070

  web:
    image: evcc/evcc:0.316.0
    restart: on-failure
    # Mounting the whole data dir (rather than bind-mounting evcc.yaml
    # directly) avoids Docker auto-creating evcc.yaml as a directory when
    # the file doesn't exist yet on first install.
    command: ["evcc", "--config", "/data/evcc.yaml"]
    volumes:
      - ${APP_DATA_DIR}/data:/data

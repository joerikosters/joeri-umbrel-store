manifestVersion: 1
id: joeri-store-evcc
name: EVCC
category: vehicles
version: "0.317.0"
tagline: EV charge controller & solar charging optimizer
description: >-
  EVCC is an open-source EV charge controller and energy management system.
  It optimizes electric vehicle charging with solar energy, dynamically
  adjusting charging power based on solar surplus, grid price, or battery
  state. Supports 200+ EV chargers (wallboxes), 100+ vehicles, and 50+ solar
  inverters/battery systems.


  This app runs in host networking mode, which SMA, KEBA and EEBus device
  discovery require to work at all in Docker. That means it is not proxied
  through Umbrel's dashboard the way most apps are: open it directly at
  http://umbrel.local:7070 (no Tor/.onion, no automatic HTTPS for this app).


  A minimal config is created automatically on first start — use evcc's own
  web UI setup wizard to add your meter, charger and vehicle, or edit
  evcc.yaml directly in this app's data directory.

releaseNotes: >-
  Synced automatically from the official Homebridge app in Umbrel's own app
  store (upstream version `2.4.0-2026-10-16`), by this store's GitHub Action.
  Port, icon and gallery overrides from this store are reapplied on top of
  upstream's definition — see this app's description for details. This note
  is generated, not reviewed; check upstream's own release notes below.


  Upstream release notes:


  ⚠️ Major update reminder: If you are upgrading from a pre-2.x Homebridge release, check plugin readiness indicators and update outdated plugins before upgrading. Older plugins that use removed Homebridge or HAP-NodeJS APIs may fail until updated.


  This image refresh updates Node.js to 24.22.0 and Homebridge APT Package to 2.0.20. Homebridge 2.4.0 and Homebridge UI 5.29.0 are unchanged.


  HAP-NodeJS now uses a built-in file storage replacement for node-persist. Saved Homebridge data is not migrated or rewritten, but rare plugins that call removed storage methods may need plugin updates.


  Full release notes can be found at https://github.com/homebridge/docker-homebridge/releases/tag/2026-10-16

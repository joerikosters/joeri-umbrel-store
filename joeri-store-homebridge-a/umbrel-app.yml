category: automation
name: Homebridge A
version: "2.4.0-2026-10-16"
tagline: "HomeKit support for the impatient"
description: >-
  Bringing HomeKit support where there is none. Homebridge allows you to integrate with smart home devices that do not natively support HomeKit.
  There are over 2000 Homebridge plugins supporting thousands of different smart accessories.


  Some of the most popular plugins include:
  
  - Ring
  
  - Nest & Nest Cameras
  
  - TP-Link Kasa Smart Home
  
  - Hue / deCONZ (Zigbee)
  
  - Belkin Wemo
  
  - myQ
  
  - UniFi Protect


  This is "Homebridge A", one of two independent Homebridge instances in the
  Joeri Store (the other is "Homebridge B"), for running two separate HomeKit
  bridges on the same Umbrel. Open it directly at http://umbrel.local:8591
  (moved off Homebridge's default UI port 8581, via
  HOMEBRIDGE_CONFIG_UI_PORT, so it never collides with the other instance or
  a stock Homebridge install on the same host network).


  Known caveat: each instance runs its own bundled Avahi (mDNS) daemon inside
  its container, alongside umbrelOS's own avahi-daemon on the host — all
  competing for UDP port 5353 in the shared host network namespace. With two
  Homebridge instances plus umbrelOS itself, HomeKit discovery for one or
  both bridges may be flaky. If that happens, see the docker-homebridge docs
  for disabling the bundled Avahi (ENABLE_AVAHI=0) and mounting the host's
  D-Bus/Avahi socket instead — not pre-configured here since it depends on
  umbrelOS's avahi-daemon exposing that socket.



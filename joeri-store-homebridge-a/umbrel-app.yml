dependencies: []
repo: https://github.com/homebridge/homebridge
support: https://github.com/homebridge/homebridge/issues
port: 8591
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
permissions:
  - GPU
releaseNotes: >-
  Switched the image to the `latest` tag with `pull_policy: always`, so
  this app now tracks Homebridge's latest release automatically on every
  (re)start instead of a pinned version. This means future Homebridge
  releases will no longer show up as an "Update" in Umbrel — they apply
  silently on the next restart. Trade-off: no more version pinning,
  rollback, or release notes for Homebridge itself; a bad upstream release
  (including a major version bump) could change behavior without warning.


  Initial release in the Joeri Store: a renamed clone of the official
  Homebridge app, as "Homebridge A" — one of two independent instances
  meant to run side by side (see "Homebridge B"). UI moved to port 8591
  (via HOMEBRIDGE_CONFIG_UI_PORT) so neither instance sits on Homebridge's
  default port 8581.
submitter: Joeri Store

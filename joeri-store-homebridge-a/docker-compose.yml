version: "3.7"

services:
  server:
    image: homebridge/homebridge:2026-10-23@sha256:3c775f1c761238ea3957d0c83c54b5270eae702236d3f67b6df81e1e621cd6e6
    environment:
      # Moves the Homebridge UI off the image's default port 8581,
      # so this instance never collides with the other Homebridge
      # clone or a stock Homebridge install on the same host
      # network.
      - HOMEBRIDGE_CONFIG_UI_PORT=8591
    # container runs as root
    network_mode: host
    # available at port 8591 (see environment above)
    volumes:
      - ${APP_DATA_DIR}/data/homebridge:/homebridge
    restart: on-failure

version: "3.7"

services:
  server:
    image: homebridge/homebridge:latest
    # Always re-pull on (re)start so this tracks Homebridge's latest release
    # instead of a pinned version — see the Joeri Store README for the
    # tradeoff (no more manual Umbrel "Update" step, but also no pinning,
    # rollback, or release notes).
    pull_policy: always
    # container runs as root
    network_mode: host
    environment:
      # Moves the Homebridge UI off the image's default port 8581, so this
      # instance never collides with a stock Homebridge install on the same
      # host network. See joeri-store-homebridge-b for the second instance,
      # which uses 8592.
      - HOMEBRIDGE_CONFIG_UI_PORT=8591
    # available at port 8591 (see environment above)
    volumes:
      - ${APP_DATA_DIR}/data/homebridge:/homebridge
    restart: on-failure

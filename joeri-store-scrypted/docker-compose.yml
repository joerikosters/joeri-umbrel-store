version: "3.7"

services:
  scrypted:
    image: ghcr.io/koush/scrypted
    restart: unless-stopped
    # network_mode: host is required for HomeKit: it advertises itself via
    # mDNS and its accessories listen on dynamic TCP ports, neither of which
    # survive Docker's bridge-network NAT. This also puts the HTTPS-only web
    # UI (self-signed cert) directly on the Umbrel's own IP at :10443,
    # bypassing umbrelOS's app_proxy — it doesn't proxy HTTPS-only backends
    # reliably. Open https://umbrel.local:10443 directly (accept the
    # certificate warning once).
    network_mode: host
    environment:
      # Makes Scrypted run its own bundled avahi (inside the container) for
      # HomeKit's mDNS advertisement, instead of trying to use the host's.
      # CAVEAT: umbrelOS's own avahi-daemon also binds UDP 5353 on the host
      # for umbrel.local resolution. Whether both can coexist depends on the
      # host's mDNS setup (SO_REUSEPORT support etc.) — not guaranteed. If
      # HomeKit accessories don't show up in the Home app, this conflict is
      # the likely cause. Do NOT stop/disable umbrelOS's avahi-daemon to fix
      # it — that breaks umbrel.local and other mDNS-dependent features.
      # Ask before doing anything that invasive; there isn't a fully clean
      # fix for HomeKit + Docker + a host that already runs its own avahi.
      - SCRYPTED_DOCKER_AVAHI=true
      - SCRYPTED_DNS_SERVER_0=1.1.1.1
      - SCRYPTED_DNS_SERVER_1=8.8.8.8
    devices:
      # Intel iGPU passthrough for hardware-accelerated transcoding
      # (QuickSync).
      - /dev/dri:/dev/dri
    volumes:
      - ${APP_DATA_DIR}/data/volume:/server/volume
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # Scrypted logs a lot; avoid wearing out flash storage. Per-device
    # in-memory logging (viewable in the UI) is preferred over a log file.
    logging:
      driver: "none"
